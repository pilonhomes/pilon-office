<style>
:root {
  /* Job-site office: charcoal like the logo, one hi-vis orange for the actions that matter. Phone-first, bottom tabs. */
  --bg: #eef0f1; --card: #ffffff; --ink: #1d2024; --muted: #68707a; --line: #dde1e5; --accent: #e8590c; --accent-ink: #ffffff;
  --ok: #2b8a3e; --warn: #b8650a; --bad: #c92a2a; --soft: #f5f6f7;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif; --body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --card: #1b1e22; --ink: #eceef0; --muted: #9aa2ab; --line: #2c3137; --accent: #ff7a33; --accent-ink: #1a0d05; --soft: #23272c;
  --ok: #51cf66; --warn: #ffa94d; --bad: #ff8787; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #121417; --card: #1b1e22; --ink: #eceef0; --muted: #9aa2ab; --line: #2c3137; --accent: #ff7a33; --accent-ink: #1a0d05; --soft: #23272c;
  --ok: #51cf66; --warn: #ffa94d; --bad: #ff8787; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
body { padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
a { color: inherit; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-left)) 8px; border-bottom: 1px solid var(--line); }
header .logo { height: 34px; border-radius: 6px; background: #fff; padding: 2px 6px; }
header .sp { flex: 1; }
header select { font: 600 13px var(--body); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
header .gear { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
main { max-width: 760px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-left)); display: grid; gap: 12px; }
#view { display: grid; gap: 12px; }
h2, h3, h4 { font-family: var(--display); font-stretch: 85%; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 26px; font-weight: 800; } h3 { font-size: 17px; font-weight: 700; } h4 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.jt { font-size: 30px; line-height: 1.05; } .jt span { font-weight: 600; color: var(--muted); }
.muted { color: var(--muted); } .sm { font-size: 12.5px; } .pad { padding: 0 4px; } .grow { flex: 1; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--muted); font-weight: 600; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--body); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; cursor: pointer; min-height: 42px; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; } .btn.danger { color: var(--bad); }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
.icon { border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 8px; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions.sticky { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent); padding: 8px 0; z-index: 3; backdrop-filter: blur(6px); }
.hero .quick { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.big { display: grid; justify-items: start; align-content: space-between; gap: 18px; min-height: 92px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 15px var(--display); font-stretch: 85%; text-align: left; cursor: pointer; }
.big .ico { width: 26px; height: 26px; }
.big.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.tile .tl { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tile .tv { font: 800 24px var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .ts { font-size: 12px; color: var(--muted); }
.tile.neg .tv, td.neg { color: var(--bad); }
.count { font: 700 12px var(--body); background: var(--soft); border-radius: 99px; padding: 1px 8px; margin-left: 4px; vertical-align: middle; }
.count.warn { color: var(--warn); }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--line); text-decoration: none; }
.card > .row:first-of-type, .card > h3 + .row { border-top: 0; }
.row .end { display: grid; justify-items: end; gap: 3px; text-align: right; }
.amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; background: var(--soft); display: grid; place-items: center; color: var(--muted); }
.chip { display: inline-block; font: 600 11px var(--body); padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.st-quoting { color: var(--muted); } .st-quote-sent { color: #1c7ed6; background: color-mix(in srgb, #1c7ed6 14%, transparent); }
.st-accepted, .st-in-progress { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.st-invoiced { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); } .st-paid { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.st-lost { text-decoration: line-through; }
.subtabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 4px -2px 0; }
.subtabs a { padding: 10px 12px; text-decoration: none; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.subtabs a.on { color: var(--ink); border-color: var(--accent); }
.form { gap: 12px; }
.fld { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
input, select, textarea { font: 16px var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; } .check input { width: auto; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.banner { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; }
.banner.ok { color: var(--ok); } .banner.warn { color: var(--warn); }
.sec.na { opacity: .6; }
.sechead { display: flex; align-items: center; gap: 10px; }
.secno { font: 800 15px var(--display); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--bg); flex: none; }
.secname { font: 700 17px var(--display); font-stretch: 85%; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 4px 0; background: transparent; }
.secprice { font: 800 20px var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; white-space: nowrap; }
.secmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.secmeta input.tiny { width: 64px; padding: 4px 6px; font-size: 14px; display: inline-block; }
.na-t { display: inline-flex; gap: 4px; align-items: center; } .na-t input { width: auto; }
.line { border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; background: var(--soft); }
.lrow { display: flex; gap: 6px; align-items: end; }
.lrow select { flex: 1; }
.lgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mini { display: grid; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
.mini input { padding: 7px 6px; font-size: 16px; }
.lsum { font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.sumbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; position: sticky; top: 58px; z-index: 4; }
.sumbar div { display: grid; } .sumbar .muted { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.sumbar b { font: 800 19px var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.totals { gap: 2px; } .tr { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
.tr.b { font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; }
.w120 { width: 120px; flex: none; }
.rimg { display: grid; gap: 8px; justify-items: start; } .rimg img { max-width: 100%; max-height: 380px; border-radius: 12px; border: 1px solid var(--line); }
.filters { grid-template-columns: 1fr; } @media (min-width: 560px) { .filters { grid-template-columns: 1.4fr 1fr 1fr; } }
.scroll { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; min-width: 160px; }
.tbl th { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tbl tr.b td { font-weight: 700; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 14px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); padding: 4px 0; font-size: 13.5px; }
.ledger { flex-wrap: wrap; } .ledger > * { flex: 1 1 110px; }
.rate { display: flex; gap: 8px; align-items: end; border-top: 1px solid var(--line); padding-top: 8px; } .rate .mini { width: 92px; flex: none; }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.empty { text-align: center; padding: 40px 16px; display: grid; gap: 10px; justify-items: center; } .empty p { max-width: 42ch; color: var(--muted); }
nav.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px max(6px, env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom)); }
nav.nav a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted); }
nav.nav a.on { color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 520px); opacity: 0; pointer-events: none; transition: .2s; z-index: 9; }
.toast.show { opacity: 1; transform: translate(-50%, 0); } .toast.err { background: var(--bad); color: #fff; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } .lgrid { grid-template-columns: 1fr 1fr; } .hero .quick { grid-template-columns: 1fr 1fr; } .hero .quick .big:first-child { grid-column: span 2; min-height: 76px; } }
.chips { display: flex; gap: 6px; overflow-x: auto; }
.chipbtn { font: 600 13px var(--body); padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; white-space: nowrap; }
.chipbtn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.msgbox { background: var(--soft); border-radius: 9px; padding: 9px 10px; font-size: 14px; }
.pre { white-space: pre-wrap; }
.msg { display: grid; gap: 6px; }
.sendopts { display: grid; gap: 6px; } .sendopts .btn { justify-content: center; }
.paper { background: #fff; color: #222; border-radius: 10px; padding: 16px; border: 1px solid var(--line); display: grid; gap: 10px; font-size: 13px; }
.paper .muted { color: #777; }
.phead { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #262626; padding-bottom: 8px; }
.phead img { height: 40px; } .phead b { font: 800 22px var(--display); }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ptbl { width: 100%; border-collapse: collapse; } .ptbl td { border-bottom: 1px solid #e3e3e3; padding: 6px 4px; vertical-align: top; } .ptbl td:last-child { text-align: right; white-space: nowrap; font-weight: 700; }
.clock.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
.clockt { font: 800 34px var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; line-height: 1.1; }
.pill { font: 600 11.5px var(--body); padding: 4px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); } .pill.bad { color: #fff; background: var(--bad); }
a.banner { text-decoration: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---------------- toast ----------------
let toastT;
function toast(msg, kind) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show " + (kind || "");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast", kind === "err" ? 7000 : 3500);
}

// ---------------- persistence ----------------
const saveQ = {};
function saveDoc(path, data) {
  if (!db) { toast("Can't save - not connected to your data.", "err"); return Promise.resolve(); }
  const prev = saveQ[path] || Promise.resolve();
  const p = prev.catch(() => {}).then(() => db.doc(path).set(JSON.parse(JSON.stringify(data)))).catch(e => {
    toast(e && e.code === "quota_exceeded" ? "Storage is full - export and delete old records." : "Couldn't save (" + (e && e.code || "error") + "). Check your connection.", "err");
    throw e;
  });
  saveQ[path] = p; return p;
}
const debT = {};
function saveSoon(path, getData, ms) {
  clearTimeout(debT[path]); debT[path] = setTimeout(() => saveDoc(path, getData()), ms || 700);
}
function delDoc(path) { return db ? db.doc(path).delete().catch(() => toast("Couldn't delete.", "err")) : Promise.resolve(); }
const saveSettings = () => saveSoon("config/settings", () => state.settings, 500);
const saveJob = j => saveSoon("jobs/" + j.id, () => j, 700);

// ---------------- boot ----------------
async function boot() {
  render();
  db = await claude.use("db");
  if (!db) { state.offline = true; render(); return; }
  const timer = setTimeout(() => { if (!state.loaded.jobs) { state.offline = "slow"; render(); } }, 10000);
  db.doc("config/settings").onSnapshot(s => {
    if (s.exists) state.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), s.data());
    state.loaded.settings = true; softRender();
  }, () => {});
  for (const col of ["jobs", "receipts", "trips", "ledger", "hours"]) {

function render() {

function receiptFileName(r) { return safeName(`${r.date || today()} ${r.vendor || "Receipt"} ${money(r.total)}`) + ".jpg"; }
function errMsg(e) {
  const c = e && e.code;
  return c === "offline" ? "No signal - it's saved on your phone and will sync when you're back online."
    : c === "unreachable" ? e.message
    : c === "not_connected" ? "Connect the app to Google in Settings first."
    : c === "auth" ? "Google refused the connection code - check it in Settings."
    : c === "claude" ? "Claude couldn't read it: " + String(e.message).replace(/^claude:\s*/, "")
    : (e && e.message) || "Something went wrong.";
}
mcpMsg = errMsg;

// ---------------- receipts ----------------
function receiptPrompt() {
  const jobs = state.jobs.filter(j => !["Paid", "Lost"].includes(j.status)).map(j => `${j.number}: ${j.project || ""} (${j.client && j.client.name || ""}, ${j.line})`).join("\n") || "(none)";
  return `You are reading a photo of a purchase receipt for a small Saskatchewan renovation and home inspection business.
Extract the receipt into JSON. Saskatchewan has 5% GST and 6% PST. If tax lines are combined, split them. If no PST is shown, pst is 0.
Pick the single best category from this exact list (copy the name exactly):
${CATS.map(c => "- " + c.name + ": " + c.help).join("\n")}
Pick the business line: "Renovation", "Inspection" or "General / both".
Open jobs (use a job number only if the receipt clearly matches one; otherwise null):
${jobs}
Reply with ONLY this JSON object:
{"date":"YYYY-MM-DD or null","vendor":"store name","description":"short summary, under 60 characters","total":0.00,"gst":0.00,"pst":0.00,"vendorGst":"supplier GST/HST number or null","category":"exact category name","line":"Renovation","job":null,"items":[{"name":"item","amount":0.00}],"notes":"anything you were unsure about, or empty"}`;
}
function applyRead(d, x, onlyEmpty) {
  if (!x || typeof x !== "object") return;
  const put = (k, v) => { if (v === null || v === undefined || v === "") return; if (onlyEmpty && d[k] !== null && d[k] !== undefined && d[k] !== "") return; d[k] = v; };
  if (x.date && /^\d{4}-\d{2}-\d{2}$/.test(x.date)) d.date = x.date;   // the printed date always wins over the snap date
  put("vendor", x.vendor); put("desc", x.description);
  for (const k of ["total", "gst", "pst"]) if (num(x[k]) !== null) put(k, r2(x[k]));
  if (x.vendorGst) put("vendorGst", String(x.vendorGst));
  if (CATS.some(c => c.name === x.category)) put("category", x.category);
  if (LINES.includes(x.line)) put("line", x.line);
  if (x.job && state.jobs.some(j => j.number === String(x.job))) put("job", String(x.job));
  if (Array.isArray(x.items)) d.items = x.items.slice(0, 40).map(i => ({ name: String(i.name || ""), amount: num(i.amount) }));
}
readReceipt = async function (d) {
  if (!platform.cfg.url) { render(); toast("Connect the app to Google (Settings) and Claude will read receipts. For now, type it in.", "err"); return; }
  if (!navigator.onLine) { d._queuedRead = true; render(); toast("No signal - save it now and Claude will read it when you're back online."); return; }
  d._reading = true; render();
  try { const x = await platform.call("readReceipt", { base64: await platform.b64(d._blob), prompt: receiptPrompt() }); applyRead(d, x.result, false); d._read = true; d._note = x.result && x.result.notes || ""; }
  catch (e) { if (e.code === "offline") { d._queuedRead = true; toast("Lost signal - Claude will read it when you're back online. Save it now."); } else toast(errMsg(e), "err"); }
  d._reading = false; render();
};
saveReceipt = async function () {
  const d = state.draft; if (!d) return;
  if (!d.date || (num(d.total) === null && !d._queuedRead)) { toast("Add at least the date and total.", "err"); return; }
  const clean = strip_(d);
  if (d._queuedRead) clean.needsRead = true;
  if (d._blob) clean.photoPending = true;
  await saveDoc("receipts/" + d.id, clean);
  if (d._blob) {
    if (d._queuedRead) await platform.queue({ type: "read", receiptId: d.id, blob: d._blob });
    await platform.queue({ type: "receiptPhoto", receiptId: d.id, blob: d._blob });
  }
  toast(navigator.onLine && platform.cfg.url ? "Saved. Filing the photo in Google Drive..." : "Saved on this phone - it will sync to Google when you're back online.");
  state.draft = null; go("receipts");
};
receiptRow = function (r) {
  const c = receiptCalc(r, S(), CATS);
  const chip = r.needsRead ? `<span class="chip warn">Claude will read</span>` : r.photoPending ? `<span class="chip warn">Photo syncing</span>` : r.driveId ? `<span class="chip ok">Drive</span>` : `<span class="chip">No photo</span>`;
  return `<a class="row" href="#receipt-${r.id}">${r.thumb ? `<img class="thumb" src="${r.thumb}" alt="">` : `<div class="thumb ph">${ico("doc")}</div>`}<div class="grow"><div><b>${esc(r.vendor || "Receipt")}</b> <span class="muted sm">${esc(r.date || "")}</span></div><div class="muted sm">${esc(r.category || "No category")}${r.job ? " · Job " + esc(r.job) : ""}</div></div><div class="end"><div class="amt">${r.total === null || r.total === undefined ? "?" : money(r.total)}</div>${chip}${r.claudeFilled ? `<span class="chip warn">Check</span>` : c.group === "?" ? `<span class="chip warn">Category?</span>` : ""}</div></a>`;
};
// a receipt Claude filled in later stays flagged until opened and saved
const _origSaveRec = saveReceipt;
saveReceipt = async function () { if (state.draft) delete state.draft.claudeFilled; return _origSaveRec(); };

// ---------------- outbox handlers (run when online) ----------------
platform.handlers.read = async it => {
  const path = "receipts/" + it.receiptId, r = platform.getData(path); if (!r) return;
  let x;
  try { x = await platform.call("readReceipt", { base64: await platform.b64(it.blob), prompt: receiptPrompt() }); }
  catch (e) { if (e.code === "claude" && it.attempts >= 1) { delete r.needsRead; r.note = (r.note ? r.note + "\n" : "") + "Claude couldn't read this one - fill it in."; await saveDoc(path, r); return; } throw e; }
  applyRead(r, x.result, true); delete r.needsRead; r.claudeFilled = true; if (x.result && x.result.notes) r.note = (r.note ? r.note + "\n" : "") + "Claude: " + x.result.notes;
  await saveDoc(path, r);
};
platform.handlers.receiptPhoto = async it => {
  const path = "receipts/" + it.receiptId, r = platform.getData(path); if (!r) return;
  if (r.needsRead) throw Object.assign(new Error("waiting for Claude to read it"), { code: "wait" });
  const up = await platform.call("upload", { base64: await platform.b64(it.blob), name: receiptFileName(r), mime: "image/jpeg", path: receiptPath(r) });
  const r2_ = platform.getData(path); if (!r2_) return;
  r2_.driveId = up.id; r2_.driveUrl = up.url; delete r2_.photoPending; await saveDoc(path, r2_);
};
platform.handlers.upload = async it => {
  const up = await platform.call("upload", { base64: await platform.b64(it.blob), name: it.name, mime: it.mime, path: it.path });
  if (it.link && it.link.col === "jobs") {
    const p = "jobs/" + it.link.id, j = platform.getData(p); if (!j) return;
    if (it.link.kind === "invoice" && j.invoice) j.invoice.file = up; else if (it.link.kind === "quote") j.quoteFile = up;
    await saveDoc(p, j);
  }
  if (it.link && it.link.settings) { S()[it.link.settings] = up; saveSettings(); }
};
platform.handlers.email = async it => {
  const p = "jobs/" + it.jobId, j = platform.getData(p);
  const res = await platform.call("email", { to: it.to, subject: it.subject, body: it.body, pdfBase64: await platform.b64(it.blob), pdfName: it.pdfName, path: it.path, fromName: S().bizName });
  if (!j) return;
  const rec = { date: today(), how: "email", to: it.to };
  if (it.kind === "invoice" && j.invoice) { j.invoice.sent = rec; j.invoice.file = res; delete j.invoice.queued; if (j.status !== "Paid") j.status = "Invoiced"; }
  else { j.quoteSent = rec; j.quoteFile = res; delete j.quoteQueued; if (["Quoting", "Quote sent"].includes(j.status || "Quoting")) j.status = "Quote sent"; }
  await saveDoc(p, j);
};

// ---------------- PDFs, sending, exports, backup ----------------
makePdf = async function (j, kind, to, btn) {
  if (!window.jspdf) { toast("The PDF maker hasn't loaded yet - open the app once with signal so it can be saved for offline use.", "err"); return; }
  const blob = buildPdf(j, kind), name = pdfName(j, kind);
  if (to === "download") { await platform.saveFile(name, blob); return; }
  await platform.queue({ type: "upload", blob, name, mime: "application/pdf", path: pathOf("Quotes & Invoices", jobFolderName(j.number)), link: { col: "jobs", id: j.id, kind } });
  if (kind === "quote" && j.status === "Quoting") { j.status = "Quote sent"; saveJob(j); }
  toast(navigator.onLine ? "Saving the PDF to Google Drive..." : "PDF queued - it goes to Google Drive when you're back online.");
  render();
};
sendCard = function (j, kind) {
  const m = clientMessage(j, kind), sent = kind === "invoice" ? (j.invoice || {}).sent : j.quoteSent;
  const queued = kind === "invoice" ? (j.invoice || {}).queued : j.quoteQueued;
  const file = kind === "invoice" ? (j.invoice || {}).file : j.quoteFile, email = j.client.email || "";
  return `<section class="card form send">
    <div class="bar"><h3>Send to client</h3>${sent ? `<span class="chip ok">Sent ${esc(sent.date)}${sent.how === "email" ? " by email" : ""}</span>` : queued ? `<span class="chip warn">Email waiting for signal</span>` : ""}</div>
    <button class="btn sm ghost" data-action="togglePreview">${state.preview ? "Hide preview" : "Preview what the client sees"}</button>
    ${state.preview ? previewDoc(j, kind) : ""}
    ${field("Client email", "job.client.email", email, { type: "email", ph: "client@email.com" })}
    <div class="msg"><div class="bar"><b class="sm">Subject</b><button class="btn sm ghost" data-action="copyMsg" data-kind="${kind}" data-part="subject">Copy</button></div><div class="msgbox">${esc(m.subject)}</div>
    <div class="bar"><b class="sm">Message</b><button class="btn sm ghost" data-action="copyMsg" data-kind="${kind}" data-part="body">Copy</button></div><div class="msgbox pre">${esc(m.body)}</div></div>
    <div class="sendopts">
      <button class="btn primary" data-action="sendDrive" data-kind="${kind}" ${email ? "" : "disabled"}>${ico("send")} Email it with the PDF attached</button>
      <p class="hint">${email ? "Sends from your Gmail to " + esc(email) + " with the PDF attached, and files a copy in Drive. No signal? It sends as soon as you're back online." : "Add the client's email to send it."}</p>
      <button class="btn" data-action="sendShare" data-kind="${kind}">${ico("down")} Share from my phone instead</button>
      <p class="hint">Copies the message and opens your iPhone's share sheet with the PDF (Mail, Messages, AirDrop...).</p>
    </div>
    <div class="actions"><button class="btn sm" data-action="pdf" data-kind="${kind}">${ico("drive")} Just save PDF to Drive</button>${!sent ? `<button class="btn sm ghost" data-action="markSent" data-kind="${kind}">Mark as sent</button>` : ""}</div>
    ${file ? `<p class="hint">PDF in Drive: <a href="${esc(file.url)}" target="_blank" rel="noopener">${esc(file.name)}</a></p>` : ""}
    ${kind === "quote" && sent ? `<div class="actions"><span class="sm muted">Client's answer:</span><button class="btn sm ${j.status === "Accepted" ? "primary" : ""}" data-action="setStatus" data-s="Accepted">Accepted</button><button class="btn sm ${j.status === "Lost" ? "primary" : ""}" data-action="setStatus" data-s="Lost">Lost</button>${j.status === "Accepted" ? `<a class="btn sm" href="#job-${j.id}-invoice">Invoice when done ${ico("fwd")}</a>` : ""}</div>` : ""}
    ${kind === "invoice" && sent ? `<div class="actions"><button class="btn sm ${j.status === "Paid" ? "primary" : ""}" data-action="setStatus" data-s="Paid">Mark paid</button></div>` : ""}
  </section>`;
};
sendToClient = async function (j, kind, how, btn) {
  if (!window.jspdf) { toast("The PDF maker hasn't loaded yet - open the app once with signal.", "err"); return; }
  const missing = kind === "quote" && !j.sections.some(s => !s.na && s.desc) ? "Write the section descriptions first so the client sees what's included." : !j.client.name ? "Add the client's name on the Details tab first." : "";
  if (missing) { toast(missing, "err"); return; }
  const m = clientMessage(j, kind), blob = buildPdf(j, kind), name = pdfName(j, kind);
  if (how === "share") {
    try { await navigator.clipboard.writeText(m.subject + "\n\n" + m.body); } catch (x) {}
    const r = await platform.saveFile(name, blob);
    if (r !== "cancelled") { markSent(j, kind, "phone"); toast("Message copied - paste it into your email."); }
    return;
  }
  const email = (j.client.email || "").trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast("Check the client's email address.", "err"); return; }
  if (btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.innerHTML = ico("send") + " Tap again to email " + esc(email); return; }
  await platform.queue({ type: "email", jobId: j.id, kind, to: email, subject: m.subject, body: m.body, blob, pdfName: name, path: pathOf("Quotes & Invoices", jobFolderName(j.number)) });
  if (kind === "invoice") j.invoice.queued = today(); else j.quoteQueued = today();
  saveJob(j); render();
  toast(navigator.onLine && platform.cfg.url ? "Sending from your Gmail..." : "Email queued - it sends when you're back online.");
};
exportAll = async function (to, btn) {
  if (!window.XLSX) { toast("The spreadsheet maker hasn't loaded yet - open the app once with signal.", "err"); return; }
  const fy = curFY(), blob = buildWorkbook(fy), name = `${S().bizName} Books FY ${fyLabel(fy, S().fyStart)} (${today()}).xlsx`;
  if (to === "download") { await platform.saveFile(name, blob); return; }
  await platform.queue({ type: "upload", blob, name, mime: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", path: ["Reports & Exports"], link: { settings: "lastExport" } });
  toast(navigator.onLine ? "Saving to Google Drive › Reports & Exports..." : "Export queued - it saves to Drive when you're back online.");
};
backup = async function (to) {
  const text = JSON.stringify(backupData()), name = `${S().bizName} backup ${today()}.json`, blob = new Blob([text], { type: "application/json" });
  if (to === "download") { await platform.saveFile(name, blob); return; }
  await platform.queue({ type: "upload", blob, name, mime: "application/json", path: ["Backups"], link: { settings: "lastBackup" } });
  toast(navigator.onLine ? "Saving backup to Google Drive › Backups..." : "Backup queued for when you're back online.");
};

// ---------------- settings: connection ----------------
const _vSettings = vSettings;
vSettings = function () {
  const c = platform.cfg, st = platform.status;
  let html = _vSettings();
  html = html.replace(/<section class="card form"><h4>Google Drive<\/h4>[\s\S]*?<\/section>/, "")
             .replace("Use it to move to the offline Google version, or to keep a safe copy.", "Your records already sync to your Google Sheet; a backup is an extra safe copy. Restore also imports a backup from the Claude version of the app.");
  const conn = `<section class="card form" id="conn"><h4>Connection to Google</h4>
    <p class="muted sm">From your Google Sheet: <b>Pilon Homes menu › 3. Show app connection code</b>.</p>
    <label class="fld" for="cfgUrl"><span>Web app address</span><input id="cfgUrl" data-cfg="url" value="${esc(c.url || "")}" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="fld" for="cfgTok"><span>Connection code</span><input id="cfgTok" data-cfg="token" value="${esc(c.token || "")}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <div class="actions"><button class="btn primary sm" data-action="testConn">Test connection</button><button class="btn sm" data-action="syncNow">Sync now</button></div>
    <div id="connResult" class="hint">${state.connInfo || ""}</div>
    <div class="kv">${kv("Status", st.state === "ok" ? "Synced" : esc(st.state))}${kv("Last sync", platform.lastSync ? new Date(platform.lastSync).toLocaleString("en-CA") : "never")}${kv("Changes waiting", String(st.pending || 0))}${kv("Photos / PDFs / emails waiting", String(st.outbox || 0))}</div>
    ${st.msg ? `<p class="banner warn">${esc(st.msg)}</p>` : ""}
    <div id="outboxList"></div>
  </section>`;
  return html.replace('<div class="bar"><h2>Settings</h2></div>', '<div class="bar"><h2>Settings</h2></div>' + conn);
};
async function paintOutbox() {
  const el = document.getElementById("outboxList"); if (!el) return;
  const items = await platform.outboxList();
  const label = { read: "Claude to read receipt", receiptPhoto: "Receipt photo to Drive", upload: "File to Drive", email: "Email to client" };
  el.innerHTML = items.length ? `<details ${items.some(i => i.attempts) ? "open" : ""}><summary>Waiting to send (${items.length})</summary>${items.map(i => `<div class="tr"><span>${esc(label[i.type] || i.type)}${i.name || i.pdfName ? " - " + esc(i.name || i.pdfName) : ""}${i.lastError ? `<br><span class="sm" style="color:var(--bad)">${esc(i.lastError)}</span>` : ""}</span><span><button class="btn sm ghost" data-action="obRetry" data-k="${i.key}">Retry</button><button class="btn sm ghost" data-action="obDel" data-k="${i.key}">Remove</button></span></div>`).join("")}</details>` : "";
}
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.cfg; if (k) platform.setCfg({ [k]: e.target.value.trim() }); });
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-action]"); if (!a) return;
  const act = a.dataset.action;
  if (act === "testConn") {
    a.disabled = true; a.textContent = "Testing...";
    try { const r = await platform.call("ping", {}, 30000); state.connInfo = `Connected. Claude receipt reading: <b>${r.claude ? "on" : "off - set the API key from the Sheet menu"}</b>. <a href="${esc(r.sheet)}" target="_blank" rel="noopener">Open your Google Sheet</a>`; platform.sync(); }
    catch (err) { state.connInfo = `<span style="color:var(--bad)">${esc(errMsg(err))}</span>`; }
    render();
  } else if (act === "syncNow") { await platform.sync(); render(); toast(platform.status.state === "ok" ? "Synced with Google." : errMsg({ code: platform.status.state, message: platform.status.msg }), platform.status.state === "ok" ? "" : "err"); }
  else if (act === "obRetry") { const it = (await platform.outboxList()).find(x => x.key === +a.dataset.k); if (it) { it.attempts = 0; it.retry = true; await platform.saveOut(it); platform.sync(); } }
  else if (act === "obDel") { if (a.dataset.confirm) { await platform.removeOut(+a.dataset.k); paintOutbox(); } else { a.dataset.confirm = 1; a.textContent = "Tap again"; } }
});

// ---------------- header status + home banner ----------------
const _render = render;
render = function () {
  _render();
  if (route() === "settings") paintOutbox();
  if (route() === "home" && !platform.cfg.url) {
    const v = document.getElementById("view");
    v.insertAdjacentHTML("afterbegin", `<a class="banner warn" href="#settings">Working on this phone only. Connect to Google in Settings to sync, read receipts with Claude and email clients.</a>`);
  }
};
function paintPill(s) {
  const el = document.getElementById("sync"); if (!el) return;
  const txt = s.st === "local" ? "Not connected" : s.st === "offline" ? (s.waiting ? s.waiting + " waiting · offline" : "Offline") : s.st === "syncing" ? "Syncing..." : s.st === "error" ? "Sync problem" : s.waiting ? s.waiting + " to sync" : "Synced";
  el.textContent = txt; el.className = "pill " + (s.st === "error" || s.failed ? "bad" : s.st === "offline" || s.st === "local" || s.waiting ? "warn" : "ok");
  el.title = s.msg || "";
  const ae = document.activeElement;
  if (route() === "settings" && !(ae && ae.closest && ae.closest("#conn"))) { clearTimeout(paintPill.t); paintPill.t = setTimeout(() => { const f = document.activeElement; if (!(f && f.matches && f.matches("#view input, #view textarea, #view select"))) render(); }, 400); }
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
platform.start(paintPill).then(boot);


</script>
